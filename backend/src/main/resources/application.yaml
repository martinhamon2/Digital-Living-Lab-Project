server:
  port: 3000
cors:
  allowed-origins:
    - http://localhost:8080 #frontend port
    - http://localhost:8081 #frontend backup port
controller:
  serial-port: ${CONTROLLER_SERIAL_PORT:}
spring:
  application:
    name: steamdeck-app

  output:
    ansi: 
      enabled: always #colorful terminal output
  datasource:
    url: jdbc:h2:file:./data/controller;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
